# Production-like local run: the app container + SQL Server, exactly as deployed to Azure.
#   cp .env.example .env    # then fill in the values
#   docker compose up --build
#   open http://localhost:8080
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  app:
    build: .
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: SqlServer
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=ServiceDesk;User ID=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Integrations__PublicUrl: http://localhost:8080
      Integrations__TeamsWebhookUrl: ${TEAMS_WEBHOOK_URL:-}
      Integrations__InboundEmailSecret: ${INBOUND_EMAIL_SECRET:-}
      AI__Provider: ${AI_PROVIDER:-Mock}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Endpoint: ${AI_ENDPOINT:-}
      AI__ChatModel: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI__EmbeddingModel: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
